{% extends "base.html" %}

{% block title %}Signed out | SkillsTrade{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-card auth-card-login">
        <div class="auth-status">
            <span class="auth-status-mark" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><path d="M8 3H4.8A1.8 1.8 0 0 0 3 4.8v10.4A1.8 1.8 0 0 0 4.8 17H8m4-3 4-4-4-4m4 4H7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <p class="auth-eyebrow">SkillsTrade</p>
            <h1>You’re signed out</h1>
            <p class="auth-description">Thanks for spending time with SkillsTrade.</p>
            <a href="{% url 'accounts:login' %}" class="auth-action-link">Sign in again</a>
        </div>
    </div>
</section>
{% endblock %}
