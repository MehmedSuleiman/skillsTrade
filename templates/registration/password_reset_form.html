{% extends "base.html" %}

{% block title %}Reset password | SkillsTrade{% endblock %}

{% block content %}
<section class="account-page st-max-w-xl st-mx-auto st-px-4 st-py-12">
    <div class="account-card st-bg-white st-border st-border-slate-200 st-rounded-2xl st-p-8 st-shadow-sm">
        <h1 class="st-text-3xl st-font-bold st-text-slate-900">Reset your password</h1>
        <p class="st-mt-2 st-text-slate-600">Enter the email address on your account. We’ll send instructions if it matches.</p>
        <form method="post" class="st-mt-6 st-space-y-5">
            {% csrf_token %}
            <div>
                <label for="id_email" class="st-block st-text-sm st-font-medium st-text-slate-700">Email address</label>
                <input type="email" name="email" id="id_email" autocomplete="email" required class="st-mt-1 st-w-full st-rounded-lg st-border st-border-slate-300 st-px-3 st-py-2">
                {{ form.email.errors }}
            </div>
            <button type="submit" class="st-rounded-lg st-bg-indigo-600 st-px-5 st-py-2-5 st-font-semibold st-text-white st-hover-bg-indigo-700">Send reset link</button>
        </form>
    </div>
</section>
{% endblock %}
