{% extends "base.html" %}

{% block title %}Change password | SkillsTrade{% endblock %}

{% block content %}
<section class="account-page st-max-w-xl st-mx-auto st-px-4 st-py-12">
    <div class="account-card st-bg-white st-border st-border-slate-200 st-rounded-2xl st-p-8 st-shadow-sm">
        <h1 class="st-text-3xl st-font-bold st-text-slate-900">Change your password</h1>
        <p class="st-mt-2 st-text-slate-600">Choose a new password for your account.</p>
        <form method="post" class="st-mt-6 st-space-y-5">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="st-rounded-lg st-bg-indigo-600 st-px-5 st-py-2-5 st-font-semibold st-text-white st-hover-bg-indigo-700">Update password</button>
        </form>
    </div>
</section>
{% endblock %}
