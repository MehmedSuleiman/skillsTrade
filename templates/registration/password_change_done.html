{% extends "base.html" %}

{% block title %}Password changed | SkillsTrade{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-card auth-card-login">
        <div class="auth-status">
            <span class="auth-status-mark" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><path d="m5 10 3.2 3.2L15.5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <p class="auth-eyebrow">Account security</p>
            <h1>Password updated</h1>
            <p class="auth-description">Your password has been changed successfully.</p>
            <a href="{% url 'common:home' %}" class="auth-action-link">Return to SkillsTrade</a>
        </div>
    </div>
</section>
{% endblock %}
