{% extends "base.html" %}

{% block title %}Check your email | SkillsTrade{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-card auth-card-login">
        <div class="auth-status">
            <span class="auth-status-mark" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><path d="M3 5.5h14v9H3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="m3.5 6 6.5 5 6.5-5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></span>
            <p class="auth-eyebrow">Account recovery</p>
            <h1>Check your email</h1>
            <p class="auth-description">If an account exists for that address, password reset instructions are on the way.</p>
            <a href="{% url 'accounts:login' %}" class="auth-text-link">Back to sign in</a>
        </div>
    </div>
</section>
{% endblock %}
