{% extends "base.html" %}

{% block title %}Password reset complete | SkillsTrade{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-card auth-card-login">
        <div class="auth-status">
            <span class="auth-status-mark" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><path d="m5 10 3.2 3.2L15.5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <p class="auth-eyebrow">Account recovery</p>
            <h1>Password reset complete</h1>
            <p class="auth-description">Your new password is ready. Sign in to continue.</p>
            <a href="{% url 'accounts:login' %}" class="auth-action-link">Sign in</a>
        </div>
    </div>
</section>
{% endblock %}
